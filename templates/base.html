<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}{% endblock %} | ErgoCalc</title>
    <meta name="description" content="{% block descricao %}Ferramentas de conscientização postural do ErgoCalc.{% endblock %}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="theme-color" content="#f5f1e8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2319b37d'/%3E%3Cpath d='M22 18h22v6H29v8h13v6H29v8h15v6H22z' fill='white'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='tema.css') }}">
    <script src="{{ url_for('static', filename='efeitos.js') }}"></script>
</head>

<body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="cabecalho">
        <div class="container navegacao">
            <a class="logo" href="{{ url_for('inicio') }}">
                <span class="logo-icone">E</span>
                <span>ErgoCalc</span>
            </a>

            <nav class="menu" aria-label="Menu principal">
                <a href="{{ url_for('inicio') }}">Início</a>
                <a href="{{ url_for('inicio') }}#postura">Postura</a>
                {% include '_links_extra.html' %}

                <a class="botao botao-pequeno" href="{{ url_for('abrir_calculadora') }}">Calculadora</a>
            </nav>
        </div>
    </header>

    <main class="pagina-calculadora" id="conteudo">
        <div class="container calc-container">
            {% block conteudo %}{% endblock %}
        </div>
    </main>

    <footer class="rodape">
        <div class="container rodape-conteudo">
            <a class="logo logo-rodape" href="{{ url_for('inicio') }}">
                <span class="logo-icone">E</span>
                <span>ErgoCalc</span>
            </a>
            <p>Projeto informativo sobre ergonomia.</p>
            <span>© 2026 ErgoCalc</span>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='ergocalc.js') }}" defer></script>
</body>
</html>
